<g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text x="36" y="44" text-anchor="start" dominant-baseline="central" font-size="30" font-weight="700" fill="#172033">电输入与 DDS 控制</text><text x="36" y="88" text-anchor="start" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">要求 1～4 · 测频、锁相与输出选择</text><rect x="260" y="126" width="420" height="84" rx="16" fill="#eff5ff" stroke="#b7cffb" stroke-width="2"/><text x="470.0" y="152.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="600" fill="#172033">信号源</text><text x="470.0" y="183.5" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">一路接 X 轴，一路送入装置</text><rect x="260" y="254" width="420" height="84" rx="16" fill="#eff5ff" stroke="#b7cffb" stroke-width="2"/><text x="470.0" y="280.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="600" fill="#172033">输入调理与整形</text><text x="470.0" y="311.5" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">提供测频和鉴相输入</text><rect x="260" y="390" width="420" height="92" rx="16" fill="#eff5ff" stroke="#b7cffb" stroke-width="2"/><text x="470.0" y="420.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="600" fill="#172033">MSPM0G3507</text><text x="470.0" y="451.5" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">测频 · 锁相 · 模式控制</text><rect x="260" y="538" width="420" height="84" rx="16" fill="#eff5ff" stroke="#b7cffb" stroke-width="2"/><text x="470.0" y="564.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="600" fill="#172033">AD9959</text><text x="470.0" y="595.5" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">CH0：频率、相位、幅度可调</text><rect x="260" y="684" width="420" height="92" rx="16" fill="#eff5ff" stroke="#b7cffb" stroke-width="2"/><text x="470.0" y="714.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="600" fill="#172033">滤波、放大与继电器</text><text x="470.0" y="745.5" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">选择直通或 DDS 输出</text><rect x="260" y="838" width="420" height="92" rx="16" fill="#eaf7f1" stroke="#a9d8c6" stroke-width="2"/><text x="470.0" y="868.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="600" fill="#172033">示波器 X-Y</text><text x="470.0" y="899.5" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">X：信号源 / Y：装置输出</text><polyline points="470,210 470,254" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/><polyline points="470,338 470,390" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/><polyline points="470,482 470,538" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/><polyline points="470,622 470,684" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/><polyline points="470,776 470,838" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="502" y="510" text-anchor="start" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">GPIO 串行控制</text><text x="502" y="653" text-anchor="start" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">CH0</text><rect x="36" y="398" width="182" height="120" rx="16" fill="#f0f8f4" stroke="#acd6c4" stroke-width="2"/><text x="127.0" y="427.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="600" fill="#172033">PFD</text><text x="127.0" y="458.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">鉴相与低通</text><text x="127.0" y="489.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">反馈电压</text><polyline points="260,296 127,296 127,398" fill="none" stroke="#168267" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/><text x="128" y="357" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#168267">输入参考</text><polyline points="260,580 127,580 127,518" fill="none" stroke="#168267" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/><text x="126" y="620" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#168267">CH1 参考</text><polyline points="218,440 260,440" fill="none" stroke="#168267" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/><text x="36" y="968" text-anchor="start" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">ADC / DAC 位于主控片内，PFD 与 DDS 为外部电路。</text></g></svg>