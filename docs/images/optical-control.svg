<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1020" viewBox="0 0 720 1020" role="img" aria-labelledby="title desc">
<title id="title">optical-control</title><desc id="desc">项目模块与信号用途的纵向总览，完整接口见硬件说明。</desc>
<defs><marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker><marker id="green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#168267"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text x="36" y="44" text-anchor="start" dominant-baseline="central" font-size="30" font-weight="700" fill="#172033">UVC 光学自动控制</text><text x="36" y="88" text-anchor="start" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">要求 5 · 信号源只接示波器 X 轴</text><rect x="140" y="126" width="440" height="78" rx="16" fill="#eff5ff" stroke="#b7cffb" stroke-width="2"/><text x="360.0" y="149.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="600" fill="#172033">示波器屏幕</text><text x="360.0" y="180.5" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">从轨迹获得反馈</text><rect x="140" y="252" width="440" height="78" rx="16" fill="#eff5ff" stroke="#b7cffb" stroke-width="2"/><text x="360.0" y="275.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="600" fill="#172033">UVC 摄像头</text><text x="360.0" y="306.5" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">USB 采集整幅图像</text><rect x="110" y="386" width="500" height="98" rx="16" fill="#eff5ff" stroke="#b7cffb" stroke-width="2"/><text x="360.0" y="419.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="600" fill="#172033">DK / Linux：Python + OpenCV</text><text x="360.0" y="450.5" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">测频 → FTW 锁定 → 形状控制</text><rect x="140" y="544" width="440" height="84" rx="16" fill="#eff5ff" stroke="#b7cffb" stroke-width="2"/><text x="360.0" y="570.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="600" fill="#172033">MSPM0G3507</text><text x="360.0" y="601.5" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">执行输出参数，发送按键事件</text><polyline points="360,204 360,252" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/><polyline points="360,330 360,386" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/><polyline points="360,484 360,544" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="394" y="357" text-anchor="start" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">USB</text><text x="394" y="513" text-anchor="start" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">UART0</text><polyline points="330,544 330,484" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="360" y="679" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="600" fill="#172033">两个阶段所需的 Y 轴信号</text><rect x="36" y="718" width="310" height="132" rx="16" fill="#eff5ff" stroke="#b7cffb" stroke-width="2"/><text x="191.0" y="753.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="600" fill="#172033">测频阶段</text><text x="191.0" y="784.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">PA15：DAC 窗口斜坡</text><text x="191.0" y="815.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">建立位置与时间的对应</text><rect x="374" y="718" width="310" height="132" rx="16" fill="#eaf7f1" stroke="#a9d8c6" stroke-width="2"/><text x="529.0" y="753.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="600" fill="#172033">图形阶段</text><text x="529.0" y="784.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">AD9959 CH0 正弦输出</text><text x="529.0" y="815.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">放大后保持目标形状</text><polyline points="290,628 290,653 191,653 191,718" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/><polyline points="430,628 430,653 529,653 529,718" fill="none" stroke="#168267" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/><text x="360" y="902" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">先用斜坡测频，再用 DDS 生成目标图形。</text><text x="360" y="940" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">Y 轴端点的实际连接见硬件说明。</text><text x="360" y="982" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="400" fill="#536176">AD9959 通过 GPIO 串行总线由主控配置。</text></g></svg>